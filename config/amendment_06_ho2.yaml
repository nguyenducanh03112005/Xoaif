hypotheses:
  primary:
    familywise_alpha: 0.05
    adjustment: Holm step-down, one-sided tests; one primary hypothesis remains after H2 power demotion, so H1 threshold is alpha 0.05
    items:
      - id: H1
        comparison: D-005 ROC-AUC > 0.55
  secondary:
    - id: H2
      comparison: repeat-rate ratio frequency>=2 vs frequency=1 > 1.5
      reason_demoted_before_lock: approximate power is 75.3% at the 4.6% prevalence reference if true RR=2, below the 80% planning target
    - id: H3
      comparison: S1/S3/S6 top-decile lift lower 95% CI >1 and precision@10% lower 95% CI > HO2 prevalence
    - id: H4
      comparison: S6 cells and RFM repeat-rate ranking direction agrees with frozen DEV ranking
    - id: H5
      comparison: fraction of 24 frozen combos passing lift>1, Kulczynski>=0.5, imbalance_ratio<=0.5 is >=1/24
    - id: H6
      comparison: AOV, orders/customer, new customers/month, and new-customer repeat rate lie in prelocked DEV trend-based bands
      status: not_testable_in_06_HO2
      reason: latest 180-day mature DEV cohort ends 2025-03; extrapolation to 2026-04 is over one year and no valid customer-level trend bands were preregistered for all four measures
