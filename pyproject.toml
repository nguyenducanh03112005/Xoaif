[build-system]
requires = ["setuptools>=65", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "xoaif-garden-mining"
version = "0.1.0"
description = "Read-only data analysis scaffold for Xoaif Garden Pancake POS"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
analysis = [
  "PyYAML>=6.0,<7",
  "duckdb>=1.3,<2",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "mlxtend>=0.23,<1",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]
dashboard = [
  "PyYAML>=6.0,<7",
  "pandas>=2.2,<4",
  "plotly>=5.0,<7",
  "streamlit>=1.50,<2",
]
dev = ["pytest>=8.0,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
