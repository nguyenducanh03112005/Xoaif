[build-system]
requires = ["setuptools>=65", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "xoaif-garden-mining"
version = "0.1.0"
description = "Read-only data analysis scaffold for Xoaif Garden Pancake POS"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
